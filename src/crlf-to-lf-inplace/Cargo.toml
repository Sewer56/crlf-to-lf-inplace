[package]
name = "crlf-to-lf-inplace"
version = "0.2.0"
edition = "2021"
description = "Fast in-place CRLF to LF line ending conversion for Rust strings. Uses memchr for good performance without custom SIMD."
repository = "https://github.com/Sewer56/crlf-to-lf-inplace"
license-file = "LICENSE"
include = ["src/**/*"]
readme = "README.MD"

[features]
default = ["std"]
std = []
[dependencies]
memchr = { version = "2.8", default-features = false, features = ["alloc"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dev-dependencies]
criterion = "0.8"

# Benchmark Stuff
[[bench]]
name = "my_benchmark"
path = "benches/my_benchmark/main.rs"
harness = false
